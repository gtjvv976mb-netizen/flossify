# The iPhone and iPad app (mobile/), built on a Mac and run in the iOS simulator against this repository's own website
# (a throwaway seeded database and the dev server, on the runner), by scripts/dev/app/ios-simulator.sh: Flossify's Swift
# builds, the app starts on each page, the page reaches the native side, the offline page shows, and every screen is
# photographed. The screenshots and logs are kept with the run (Artifacts: ios-simulator).
#
# A Mac runner costs ten times a Linux one in a private repository's minutes, so this runs only for a pull request
# that touches the app, or by hand (Actions → iOS app → Run workflow).
name: iOS app

on:
  workflow_dispatch:
    inputs:
      store_sizes:
        description: 'App Store sizes: photograph on the biggest iPhone (6.9-inch Pro Max) and the 13-inch iPad'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/components/app-shell.js'
      - 'src/components/AppShell.astro'
      - 'src/pages/app/**'
      - 'scripts/dev/app/ios-simulator.sh'
      - '.github/workflows/ios-app.yml'

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PGHOST: localhost
      PGPORT: '5432'
      DB: flossify_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Xcode
        run: xcodebuild -version && xcrun simctl list runtimes

      - name: PostgreSQL (throwaway, on the runner)
        run: |
          brew install postgresql@16 >/dev/null
          PG="$(brew --prefix postgresql@16)/bin"
          echo "$PG" >> "$GITHUB_PATH"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" --auth=trust >/dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 5432 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start

      - name: The website's packages
        run: npm ci

      - name: A seeded throwaway database
        run: scripts/db/setup.sh

      - name: The website (dev server on localhost:4321)
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          DATABASE_URL="postgres://flossify_app:flossify_dev@127.0.0.1:5432/$DB" \
          SESSION_SECRET='ci-only-secret-for-the-simulator-run-0123456789abcdef' \
          SMS_PROVIDER=console UPLOAD_DIR="$RUNNER_TEMP/uploads" TRUST_PROXY=0 \
            nohup node node_modules/astro/bin/astro.mjs dev --port 4321 --host localhost >"$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null --max-time 5 http://localhost:4321/healthz && exit 0
            sleep 2
          done
          tail -40 "$RUNNER_TEMP/site.log"
          exit 1

      - name: Build the app and run it in the simulator
        env:
          DEVICES: ${{ inputs.store_sizes && 'iPhone [0-9]+ Pro Max$;iPad Pro 13-inch' || '' }}
        run: OUT="$RUNNER_TEMP/ios-shots" scripts/dev/app/ios-simulator.sh

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/ios-shots/*.png
            ${{ runner.temp }}/ios-shots/*.log
            ${{ runner.temp }}/ios-shots/*.txt
            ${{ runner.temp }}/ios-shots/*.syslog
            ${{ runner.temp }}/site.log
          if-no-files-found: warn
