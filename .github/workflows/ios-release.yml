# Builds the iPhone and iPad app for release, signs it and uploads it to App Store Connect, where it appears in
# TestFlight after Apple's processing (about 15 minutes) and can then be sent for review. Only by hand:
# Actions → iOS release → Run workflow. Nothing here is a password: signing uses an App Store Connect API key, and Xcode
# makes and keeps the distribution certificate and profile in Apple's cloud (cloud-managed signing).
#
# Four repository secrets (Settings → Secrets and variables → Actions), made by the owner (mobile/README.md,
# "Signing, TestFlight and the App Store"):
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com → Membership details)
#   APP_STORE_CONNECT_KEY_ID      the API key's Key ID (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID shown above the keys on that page
#   APP_STORE_CONNECT_API_KEY     the whole contents of the downloaded AuthKey_XXXXXXXXXX.p8 file
# The key needs the Admin role: cloud-managed signing will not make a distribution certificate for a lesser one.
#
# The version people see (1.0) is MARKETING_VERSION in the Xcode project; the build number is this workflow's run
# number, so every upload is new to App Store Connect.
name: iOS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: The secrets are there
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi

      # App Store uploads must be built with the iOS 26 SDK (Xcode 26) or newer: use the newest Xcode on the runner.
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{ split($2, v, "."); if (v[1] < 26) { print "::error::App Store uploads need Xcode 26 or newer"; exit 1 } }'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The shipped config: the app opens https://flossify.ph/app/, with Web Inspector off.
      - name: The app's packages and config
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
          node -e '
            const c = require("./ios/App/App/capacitor.config.json");
            if (c.server.url !== "https://flossify.ph/app/") throw new Error("the app must open https://flossify.ph/app/, not " + c.server.url);
            if (c.ios.webContentsDebuggingEnabled) throw new Error("webContentsDebuggingEnabled must be off in a release");'

      - name: The API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Archive (signed)
        working-directory: mobile/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Flossify.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*Flossify|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/archive.log" || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -40; exit 1; }

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Flossify.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          V=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/Flossify.xcarchive/Info.plist")
          echo "Uploaded Flossify $V (build ${{ github.run_number }}). It shows in App Store Connect → TestFlight once Apple has processed it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
